name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          brew install ldid xz dpkg
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          curl -sLo sdk.tar.xz "https://github.com/theos/sdks/releases/download/iPhoneOS17.5-15.4/iPhoneOS17.5.sdk.tar.xz"
          tar -xJf sdk.tar.xz -C $HOME/theos/sdks || { curl -sLo sdk.tar.xz "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz" && tar -xJf sdk.tar.xz -C $HOME/theos/sdks; }
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
      - name: Build Tweak
        run: |
          cd tweak
          make FINALPACKAGE=1
          
      - name: Package DEB
        run: |
          chmod +x package_deb.sh
          ./package_deb.sh
          
      - uses: actions/upload-artifact@v4
        with:
          name: fembabecam-deb
          path: "*.deb"

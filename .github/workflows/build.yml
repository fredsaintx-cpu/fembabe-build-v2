name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install dpkg ldid
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xzC ~/theos/sdks
          mv ~/theos/sdks/sdks-master/*.sdk ~/theos/sdks/ 2>/dev/null || true
      - name: Build
        run: |
          export THEOS=~/theos
          make
      - name: Package
        run: |
          chmod +x package_deb.sh
          ./package_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fembabe-deb
          path: packages/*.deb

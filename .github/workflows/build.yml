name: Build FemBabe iOS 18

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid make dpkg
          git clone --depth=1 https://github.com/theos/theos.git $THEOS
          $THEOS/bin/update-theos
          curl -sL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz | tar -xJf - -C $THEOS/sdks/

      - name: Build Tweak
        run: |
          cd tweak
          make FINALPACKAGE=1

      - name: Build Daemon
        run: |
          cd daemon
          make FINALPACKAGE=1

      - name: Package DEB
        run: |
          chmod +x package_deb.sh
          ./package_deb.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fembabecam-deb
          path: "*.deb"

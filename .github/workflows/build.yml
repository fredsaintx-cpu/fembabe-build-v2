name: Build libroothide stub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg

      - name: Build libroothide stub
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -arch arm64e \
            -dynamiclib \
            -install_name /var/jb/usr/lib/libroothide.dylib \
            -miphoneos-version-min=14.0 \
            -fvisibility=default \
            -o libroothide.dylib \
            libroothide.c
          
          ldid -S libroothide.dylib
          file libroothide.dylib

      - name: Package DEB
        run: |
          mkdir -p pkg/var/jb/usr/lib
          cp libroothide.dylib pkg/var/jb/usr/lib/
          mkdir -p pkg/DEBIAN
          printf "Package: com.fembabe.libroothide-stub\nName: libroothide Stub\nVersion: 1.0.0\nArchitecture: iphoneos-arm64\nDescription: Stub libroothide for Dopamine\nMaintainer: FemBabe\nSection: System\n" > pkg/DEBIAN/control
          dpkg-deb -Zxz -b pkg libroothide-stub_1.0.0.deb
          ls -la *.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libroothide-stub
          path: "*.deb"

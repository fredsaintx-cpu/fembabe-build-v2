name: Build libroothide stub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libroothide stub
        run: |
          # Direct clang compile for iOS
          xcrun -sdk iphoneos clang -arch arm64 -arch arm64e \
            -dynamiclib \
            -install_name /var/jb/usr/lib/libroothide.dylib \
            -miphoneos-version-min=14.0 \
            -fvisibility=default \
            -o libroothide.dylib \
            libroothide.c
          
          # Sign with ldid
          brew install ldid
          ldid -S libroothide.dylib
          
          file libroothide.dylib
          ls -la libroothide.dylib

      - name: Package DEB
        run: |
          mkdir -p pkg/var/jb/usr/lib
          cp libroothide.dylib pkg/var/jb/usr/lib/
          mkdir -p pkg/DEBIAN
          echo "Package: com.fembabe.libroothide-stub
          Name: libroothide Stub
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: Stub libroothide for Dopamine
          Maintainer: FemBabe
          Section: System" > pkg/DEBIAN/control
          dpkg-deb -Zxz -b pkg libroothide-stub_1.0.0.deb
          ls -la *.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libroothide-stub
          path: "*.deb"

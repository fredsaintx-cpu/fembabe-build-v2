name: Build vcam

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -arch arm64e -miphoneos-version-min=14.0 -O2 -o vcam_rtmpd vcam_rtmpd.c -lpthread
          
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.security.no-container</key>
            <true/>
          </dict>
          </plist>' > ent.plist
          
          ldid -Sent.plist vcam_rtmpd
          file vcam_rtmpd
          ls -la vcam_rtmpd

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vcam_rtmpd
          path: vcam_rtmpd

name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          brew install ldid xz dpkg
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          $HOME/theos/bin/update-theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
      - name: Build Tweak
        run: |
          cd tweak
          make FINALPACKAGE=1
          
      - name: Package DEB
        run: |
          chmod +x package_deb.sh
          ./package_deb.sh
          
      - uses: actions/upload-artifact@v4
        with:
          name: fembabecam-deb
          path: "*.deb"
